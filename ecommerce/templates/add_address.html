{% extends 'base.html' %}
{% block title %}Add Address — Sportify{% endblock %}

{% block content %}
<style>
  @media (max-width: 768px) {
    .container {
      margin-top: 40px !important;
      padding: 0 12px !important;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 32px !important;
    }

    .form-label {
      font-size: 12px;
    }

    .form-control {
      font-size: 14px;
      padding: 10px 14px !important;
    }

    .row .col-6 {
      flex: 0 0 100%;
      max-width: 100%;
    }

    .btn {
      font-size: 14px;
      padding: 12px 20px !important;
    }
  }

  @media (max-width: 480px) {
    .container {
      margin-top: 30px !important;
      padding: 0 8px !important;
    }

    h1 {
      font-size: 20px;
    }

    .form-label {
      font-size: 11px;
      margin-bottom: 4px !important;
    }

    .mb-4 {
      margin-bottom: 16px !important;
    }

    .form-control {
      font-size: 13px;
      padding: 8px 12px !important;
    }
  }
</style>

<div class="container mt-5">
    <div style="max-width: 500px; margin: auto;">
        <a href="{% url 'addresses' %}" class="text-dark text-decoration-none d-block mb-4">
            <i class="bi bi-chevron-left"></i> Back to Addresses
        </a>

        <h1 class="fw-bold mb-4">Add New Address</h1>
        
        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label fw-bold text-uppercase small text-muted">Full Name</label>
                <input type="text" name="full_name" class="form-control form-control-lg rounded-3" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold text-uppercase small text-muted">Phone Number</label>
                <input type="text" name="phone" class="form-control form-control-lg rounded-3" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold text-uppercase small text-muted">Street Address</label>
                <input type="text" name="address" class="form-control form-control-lg rounded-3" required>
            </div>
            <div class="row">
                <div class="col-6 mb-4">
                    <label class="form-label fw-bold text-uppercase small text-muted">City</label>
                    <input type="text" name="city" class="form-control form-control-lg rounded-3" required>
                </div>
                <div class="col-6 mb-4">
                    <label class="form-label fw-bold text-uppercase small text-muted">Postal Code</label>
                    <input type="text" name="zip" class="form-control form-control-lg rounded-3" required>
                </div>
            </div>
            <div class="mb-5">
                <label class="form-label fw-bold text-uppercase small text-muted">Country</label>
                <input type="text" name="country" class="form-control form-control-lg rounded-3" value="Türkiye" required>
            </div>

            <button type="submit" class="btn btn-dark w-100 rounded-pill py-3 fw-bold">Save Address</button>
        </form>
    </div>
</div>
