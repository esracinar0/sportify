{% extends 'base.html' %}
{% block title %}Password Updated — Sportify{% endblock %}

{% block extra_css %}
<style>
  .auth-page {
    min-height: calc(100vh - 64px);
    display: flex; align-items: center;
    justify-content: center; padding: 60px 20px; background: #fff;
  }
  .auth-card { width: 100%; max-width: 420px; text-align: center; }
  .auth-brand { margin-bottom: 40px; }
  .auth-brand .logo {
    font-size: 28px; font-weight: 900;
    letter-spacing: -0.5px; text-transform: uppercase; color: #0a0a0a;
  }
  .auth-brand .logo span { color: #E8000D; }
  .success-icon {
    width: 64px; height: 64px; background: #f8f8f8;
    border-radius: 50%; display: flex; align-items: center;
    justify-content: center; margin: 0 auto 28px; font-size: 28px;
  }
  h2 { font-size: 24px; font-weight: 800; margin-bottom: 14px; }
  .desc { font-size: 14px; color: #6c757d; line-height: 1.7; margin-bottom: 32px; }
  .btn-sp {
    display: inline-block; padding: 14px 40px; background: #0a0a0a; color: #fff;
    border-radius: 2px; font-size: 13px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    text-decoration: none; transition: background 0.2s;
  }
  .btn-sp:hover { background: #E8000D; color: #fff; }
</style>
{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo">Sport<span>ify</span></div>
    </div>

    <div class="success-icon">✅</div>
    <h2>Password updated!</h2>
    <p class="desc">
      Your Sportify password has been successfully changed.<br>
      You can now sign in with your new password.
    </p>
    <a href="{% url 'login' %}" class="btn-sp">Sign In Now</a>
  </div>
</div>
{% endblock %}
