{% extends 'base.html' %}
{% block title %}Add Payment Method — Sportify{% endblock %}

{% block content %}
<div class="container mt-5">
    <div style="max-width: 500px; margin: auto;">
        
        <a href="{% url 'payment_methods' %}" class="text-dark text-decoration-none d-block mb-4">
            <i class="bi bi-chevron-left"></i> Back to Payment Methods
        </a>

        <h1 class="fw-bold mb-2">Add Card</h1>
        <p class="text-muted mb-5">Enter your card details below. We only store the last 4 digits for your security.</p>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="form-label fw-bold text-uppercase small text-muted">Cardholder Name</label>
                <input type="text" name="card_holder" class="form-control form-control-lg rounded-3" placeholder="First Last" required>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold text-uppercase small text-muted">Card Number</label>
                <input type="text" id="cardNumber" name="card_number" class="form-control form-control-lg rounded-3" 
                       placeholder="0000 0000 0000 0000" maxlength="19" required>
            </div>

            <div class="row">
                <div class="col-6 mb-4">
                    <label class="form-label fw-bold text-uppercase small text-muted">Expiry Date</label>
                    <input type="text" id="expiryDate" name="expiry" class="form-control form-control-lg rounded-3" 
                           placeholder="MM/YY" maxlength="5" required>
                </div>
                <div class="col-6 mb-4">
                    <label class="form-label fw-bold text-uppercase small text-muted">CVV</label>
                    <input type="text" name="cvv" class="form-control form-control-lg rounded-3" placeholder="123" maxlength="3" required>
                </div>
            </div>

            <div class="form-check mb-5">
                <input class="form-check-input" type="checkbox" name="is_default" id="defaultCard">
                <label class="form-check-label text-muted" for="defaultCard">Set as default payment method</label>
            </div>

            <button type="submit" class="btn btn-dark w-100 rounded-pill py-3 fw-bold">Save Card</button>
        </form>
    </div>
</div>

<script>
    // --- FORMAT CARD NUMBER (0000 0000 0000 0000) ---
    const cardInput = document.getElementById('cardNumber');
    cardInput.addEventListener('input', function (e) {
        let value = e.target.value.replace(/\D/g, ''); // Remove all non-digits
        let formattedValue = value.match(/.{1,4}/g)?.join(' ') || ''; // Add space every 4 digits
        e.target.value = formattedValue;
    });

    // --- FORMAT EXPIRY DATE (MM/YY) ---
    const expiryInput = document.getElementById('expiryDate');
    expiryInput.addEventListener('input', function (e) {
        let value = e.target.value.replace(/\D/g, ''); // Remove all non-digits
        if (value.length > 2) {
            e.target.value = value.substring(0, 2) + '/' + value.substring(2, 4); // Add the slash
        } else {
            e.target.value = value;
        }
    });
</script>
{% endblock %}
